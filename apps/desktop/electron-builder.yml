appId: org.yuwendesk.app
productName: 语文备课工作台
copyright: YuwenDesk

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - package.json

asar: true

# 仅打包目标平台运行依赖，构成离线安装包；不联网拉取运行时。
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: YuwenDesk-Setup-${version}-x64.exe
  # 代码签名由持有人受控凭据在 CI 注入（S13）；缺凭据时输出未签名工程测试包。

nsis:
  oneClick: true
  perMachine: false
  allowElevation: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
  shortcutName: 语文备课工作台
  installerLanguages:
    - zh_CN
  language: "2052"

# 供 Linux 侧做打包配置冒烟验证（工程验证级），不作为教师交付物。
linux:
  target:
    - dir
  category: Education
