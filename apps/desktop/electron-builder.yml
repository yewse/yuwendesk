appId: org.yuwendesk.app
productName: 语文备课工作台
copyright: YuwenDesk

# 工程构建显式禁止自动发布（只由已批准的 CI 工件步骤分发；不外发到任何 Release/渠道）。
publish: null

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - package.json
  # pdfjs-dist 的 canvas 是可选 Node 绘图后端；本应用仅使用 PDF 文本提取，不将其打包。
  - "!node_modules/canvas/**/*"

# 自动重建会连同可选 canvas 一起编译并要求系统级 Cairo/GTK。必需的原生模块由构建脚本定向重建。
npmRebuild: false

# 随应用打包内置许可 CJK 字体（不依赖目标机系统字体路径）。运行期在 resources/assets/fonts 解析。
extraResources:
  - from: assets/fonts
    to: assets/fonts

asar: true

# 仅打包目标平台运行依赖，构成离线安装包；不联网拉取运行时。
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: YuwenDesk-Setup-${version}-x64.exe
  # 代码签名由持有人受控凭据在 CI 注入（S13）；缺凭据时输出未签名工程测试包。

nsis:
  oneClick: true
  perMachine: false
  allowElevation: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
  shortcutName: 语文备课工作台
  installerLanguages:
    - zh_CN
  language: "2052"

# 供 Linux 侧做打包配置冒烟验证（工程验证级），不作为教师交付物。
linux:
  target:
    - dir
  category: Education
